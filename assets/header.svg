<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="kamten7 — Java backend and LLM application engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="52%" stop-color="#0A1526"/>
      <stop offset="100%" stop-color="#08161A"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="58%" stop-color="#CFFAFE"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="edgeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="url(#bg)"/>
  <rect width="1000" height="240" fill="url(#grid)"/>
  <ellipse cx="840" cy="30" rx="270" ry="180" fill="url(#glow)"/>

  <!-- corner ticks -->
  <g stroke="#22D3EE" stroke-width="1.4" stroke-opacity="0.55" fill="none">
    <path d="M24 46V24h22"/>
    <path d="M976 46V24h-22"/>
    <path d="M24 194v22h22"/>
    <path d="M976 194v22h-22"/>
  </g>

  <!-- label -->
  <rect x="60" y="44" width="7" height="7" rx="1.5" fill="#2DD4BF"/>
  <text x="76" y="51.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="3" fill="#5B6B85">README · PROFILE</text>

  <!-- name -->
  <text x="58" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#nameFill)">kamten7</text>

  <!-- subtitle -->
  <text x="60" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8FA1BA">Software Engineering · Undergraduate</text>

  <!-- tagline -->
  <text x="60" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.6" fill="#6FD3E8">Java Backend · Spring Boot · LLM Application Engineering</text>

  <!-- terminal -->
  <g>
    <rect x="646" y="52" width="292" height="142" rx="12" fill="#0B1526" stroke="#1B2A40"/>
    <circle cx="666" cy="70" r="4" fill="#F87171"/>
    <circle cx="682" cy="70" r="4" fill="#FBBF24"/>
    <circle cx="698" cy="70" r="4" fill="#34D399"/>
    <text x="922" y="74" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#3E4F68">zsh — 80x24</text>
    <line x1="646" y1="84" x2="938" y2="84" stroke="#1B2A40"/>

    <text x="666" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#2DD4BF">$ ./mvnw -q verify</text>
    <text x="666" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#4ADE80">BUILD SUCCESS</text>
    <text x="666" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748B">$ git log -1 --format=%s</text>
    <text x="666" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#CBD5E1">feat: order state machine</text>
  </g>

  <rect x="0" y="238" width="1000" height="2" fill="url(#edgeLine)"/>
</svg>
