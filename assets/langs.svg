<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Language spectrum: Java 66.5%, Vue 20.4%, JavaScript 5.6%, TypeScript 3.1%, CSS 3.1%, other 1.4%">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080E18"/>
      <stop offset="100%" stop-color="#0B1826"/>
