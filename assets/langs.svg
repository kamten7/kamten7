    <rect x="651.5" y="74" width="187.8" height="16" fill="#42B883"/>
    <rect x="839.3" y="74" width="51.2" height="16" fill="#F7DF1E"/>
    <rect x="890.5" y="74" width="28.6" height="16" fill="#3178C6"/>
