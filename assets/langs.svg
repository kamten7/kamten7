  <text x="54" y="40.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#5B6B85">LANGUAGE SPECTRUM</text>
  <text x="960" y="40.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" fill="#44556E">5 个主要仓库 · 按字节统计</text>

  <g clip-path="url(#barClip)">
