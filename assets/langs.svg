    <circle cx="664" cy="120" r="5" fill="#F7DF1E"/>
    <text x="678" y="124.5" font-size="13" fill="#DCE6F2">JavaScript</text>
    <text x="768" y="124.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7C8EA8">5.6%</text>

    <!-- row 2 -->
    <circle cx="44" cy="158" r="5" fill="#3178C6"/>
